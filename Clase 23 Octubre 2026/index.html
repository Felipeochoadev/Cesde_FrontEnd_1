<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>localstorage</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    

    <div class="container">
        <div class="row justify-content-center">
            <!-- Titulo -->
            <div class="col-12">
                <h1 class="text-center my-3 text-primary"> Listado de productos</h1>
            </div>
             <!-- Formulario -->
            <div class="col-6">
                <form>
                    <div class="mb-3">
                        <label for="nombre-pro" class="form-label">Nombre Producto</label>
                        <input type="email" class="form-control" id="nombre-pro">
                    </div>
                    <div class="mb-3">
                        <label for="precio-pro" class="form-label">precio producto</label>
                        <input type="number" class="form-control" id="precio-pro">
                    </div>
                    <div class="mb-3">
                        <label for="descripcion-pro" class="form-label">Descripcion Producto</label>
                        <input type="text" class="form-control" id="descripcion-pro">
                    </div>
                    <div class="mb-3">
                        <label for="imagen-pro" class="form-label">imagen Producto</label>
                        <input type="url" class="form-control" id="imagen-pro">
                    </div>
                    <button type="button" class="btn btn-primary btn-guardar">Guardar Producto</button>
                </form>
            </div>
             <!-- Listado -->
            <div class="col-8"></div>
        </div>
    </div>
    
    <script src="localstorage.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
