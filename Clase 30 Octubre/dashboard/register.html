<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>Inventario - Crear Cuenta</title>

    <!-- Custom fonts for this template-->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">

    <!-- Custom styles for this template-->
    <link href="css/sb-admin-2.min.css" rel="stylesheet">

</head>

<body class="bg-gradient-primary">

    <div class="container">

        <div class="card o-hidden border-0 shadow-lg my-5">
            <div class="card-body p-0">
                <!-- Nested Row within Card Body -->
                <div class="row">
                    <div class="col-lg-5 d-none d-lg-block bg-register-image" style="background-image: url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=700&q=80'); background-size: cover; background-position: center;"></div>
                    <div class="col-lg-7">
                        <div class="p-5">
                            <div class="text-center">
                                <h1 class="h4 text-gray-900 mb-2 font-weight-bold">¡Crea tu Cuenta!</h1>
                                <p class="text-muted small mb-4">Regístrate para gestionar el inventario</p>
                            </div>
                            <form class="user" id="form-register">
                                <div class="form-group row">
                                    <div class="col-sm-6 mb-3 mb-sm-0">
                                        <input type="text" class="form-control form-control-user" id="exampleFirstName"
                                            placeholder="Nombres" required>
                                    </div>
                                    <div class="col-sm-6">
                                        <input type="text" class="form-control form-control-user" id="exampleLastName"
                                            placeholder="Apellidos" required>
                                    </div>
                                </div>
                                <div class="form-group row">
                                    <div class="col-sm-6 mb-3 mb-sm-0">
                                        <input type="text" class="form-control form-control-user" id="exampleUsername"
                                            placeholder="Nombre de Usuario" required>
                                    </div>
                                    <div class="col-sm-6">
                                        <select class="form-control" id="exampleRole" style="border-radius: 10rem; height: 50px; padding: 0 1rem; font-size: 0.8rem;" required>
                                            <option value="vendedor" selected>Rol: Vendedor</option>
                                            <option value="administrador">Rol: Administrador</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <input type="email" class="form-control form-control-user" id="exampleInputEmail"
                                        placeholder="Correo Electrónico" required>
                                </div>
                                <div class="form-group row">
                                    <div class="col-sm-6 mb-3 mb-sm-0">
                                        <input type="password" class="form-control form-control-user"
                                            id="exampleInputPassword" placeholder="Contraseña" required>
                                    </div>
                                    <div class="col-sm-6">
                                        <input type="password" class="form-control form-control-user"
                                            id="exampleRepeatPassword" placeholder="Confirmar Contraseña" required>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary btn-user btn-block font-weight-bold shadow-sm">
                                    <i class="fas fa-user-plus mr-1"></i> Registrar Cuenta
                                </button>
                            </form>
                            <hr>
                            <div class="text-center">
                                <a class="small" href="login.html">¿Ya tienes una cuenta? ¡Inicia sesión!</a>
                            </div>
                            <div class="text-center">
                                <a class="small font-weight-bold text-success" href="../front/index.html"><i class="fas fa-store mr-1"></i> Volver a la Tienda</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap core JavaScript-->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.bundle.min.js"></script>

    <!-- Core plugin JavaScript-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-easing/1.4.1/jquery.easing.min.js"></script>

    <!-- Custom scripts for all pages-->
    <script src="js/sb-admin-2.min.js"></script>
    <script src="js/db.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const formRegister = document.querySelector("#form-register");
            const firstName = document.querySelector("#exampleFirstName");
            const lastName = document.querySelector("#exampleLastName");
            const usernameInput = document.querySelector("#exampleUsername");
            const roleInput = document.querySelector("#exampleRole");
            const emailInput = document.querySelector("#exampleInputEmail");
            const passInput = document.querySelector("#exampleInputPassword");
            const repeatPassInput = document.querySelector("#exampleRepeatPassword");

            formRegister.addEventListener("submit", (e) => {
                e.preventDefault();

                if (passInput.value !== repeatPassInput.value) {
                    mostrarNotificacion("Las contraseñas no coinciden. Por favor verifícalas.", "danger");
                    return;
                }

                if (passInput.value.length < 4) {
                    mostrarNotificacion("La contraseña debe tener al menos 4 caracteres.", "danger");
                    return;
                }

                const usuarios = obtenerUsuarios();
                const yaExiste = usuarios.find(u => 
                    u.usuario.toLowerCase() === usernameInput.value.trim().toLowerCase() ||
                    (u.email && u.email.toLowerCase() === emailInput.value.trim().toLowerCase())
                );

                if (yaExiste) {
                    mostrarNotificacion("El usuario o correo electrónico ya está registrado.", "danger");
                    return;
                }

                const nuevoUsuario = {
                    id: Date.now(),
                    usuario: usernameInput.value.trim(),
                    contrasena: passInput.value,
                    rol: roleInput.value,
                    nombre: `${firstName.value.trim()} ${lastName.value.trim()}`,
                    email: emailInput.value.trim(),
                    creado: new Date().toISOString().split("T")[0]
                };

                usuarios.push(nuevoUsuario);
                guardarUsuarios(usuarios);

                mostrarNotificacion("¡Cuenta creada exitosamente! Redirigiendo al login...", "success");
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1200);
            });
        });
    </script>

</body>

</html>
